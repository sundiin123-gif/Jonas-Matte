[app]

; Sett til true for automatisk innlogging på Jonas-kontoen.
; Med Supabase må Jonas logge inn med passord én gang først.
; Standard er false.
auto_login_jonas = false

; Bruker-ID-en som brukes når automatisk innlogging er aktivert.
; Kun brukt for utvikling.
jonas_user_id = 

[supabase]
; Keep enabled for the bundled Supabase project, or set false for local-only mode.
; Fill both fields to use your own Supabase project instead.
enabled = true
project_url =
publishable_key =
